<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Command Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f1729 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 80px);
        }
        
        /* Left Panel - Agent Fleet */
        .fleet-panel {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
        }
        
        .fleet-header {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .fleet-count {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        
        .agent-list { display: flex; flex-direction: column; gap: 10px; }
        
        .agent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .agent-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        .agent-item.active { background: rgba(255,215,0,0.1); border: 2px solid #ffd700; }
        .agent-item.working { background: rgba(255,215,0,0.1); border-color: #ffd700; }
        
        .online-indicator {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: #00ff88;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .agent-avatar.article { background: rgba(0,212,255,0.15); }
        .agent-avatar.funnel { background: rgba(255,107,107,0.15); }
        .agent-avatar.video { background: rgba(168,85,247,0.15); }
        .agent-avatar.research { background: rgba(255,193,7,0.15); }
        .agent-avatar.code { background: rgba(0,230,118,0.15); }
        .agent-avatar.design { background: rgba(233,30,99,0.15); }
        .agent-avatar.social { background: rgba(33,150,243,0.15); }
        .agent-avatar.email { background: rgba(255,87,34,0.15); }
        .agent-avatar.analytics { background: rgba(156,39,176,0.15); }
        
        .agent-info { flex: 1; }
        .agent-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 2px; }
        .agent-status-text { font-size: 0.7rem; color: #666; }
        .agent-status-text.online { color: #00ff88; }
        .agent-status-text.working { color: #ffd700; }
        
        /* Center Panel */
        .center-panel {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        
        .center-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }
        
        .agent-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .profile-info h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .profile-info p {
            color: #888;
            font-size: 0.9rem;
        }
        
        .stats-grid {
            display: flex;
            gap: 40px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .stat-value.completed { color: #888; }
        .stat-value.online { color: #a855f7; }
        
        .stat-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            margin-top: 5px;
        }
        
        .working-section {
            background: rgba(255,215,0,0.05);
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .section-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 20px;
            align-self: flex-start;
        }
        
        .working-agent {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .working-avatar {
            width: 100px;
            height: 100px;
            background: rgba(168,85,247,0.2);
            border: 2px solid #a855f7;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        
        .working-details h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        
        .working-details p {
            color: #888;
            font-size: 0.85rem;
        }
        
        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            width: 60%;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            border-radius: 2px;
            animation: progressPulse 2s ease-in-out infinite;
        }
        
        @keyframes progressPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .active-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        /* Right Panel */
        .right-panel {
            width: 380px;
            background: rgba(0,0,0,0.3);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .menu-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .menu-header h2 { 
            font-size: 1.1rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        .tasks-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .section-count {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            background: rgba(0,255,136,0.2);
            color: #00ff88;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="header">
        <h1>🎬 AI Agent Command Center</h1>
    </div>
    
    <div class="main-container">
        <!-- Left Panel - Agent Fleet -->
        <div class="fleet-panel">
            <div class="fleet-header">
                <span>Agent Fleet</span>
                <span class="fleet-count">9 Total</span>
            </div>
            <div class="agent-list" id="agent-list"></div>
        </div>
        
        <!-- Center Panel -->
        <div class="center-panel">
            <div class="center-header">
                <div class="agent-profile">
                    <div class="profile-avatar">🎬</div>
                    <div class="profile-info">
                        <h2>Pacino (Lead Agent)</h2>
                        <p>Coordinating agent fleet and task delegation</p>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="active-count">1</div>
                        <div class="stat-label">Active</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value completed">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value online" id="online-count">3</div>
                        <div class="stat-label">Online</div>
                    </div>
                </div>
            </div>
            
            <div class="working-section" id="working-section" style="position: relative;">
                <div class="active-badge">1 ACTIVE</div>
                <div class="section-label">Currently Working</div>
                <div class="working-agent">
                    <div class="working-avatar">🎬</div>
                    <div class="working-details">
                        <h3>Video Agent</h3>
                        <p>Create clips</p>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Panel - Main Menu -->
        <div class="right-panel">
            <div class="menu-header">
                <h2>📋 Main Menu</h2>
            </div>
            
            <div class="tasks-section">
                <div class="section-header">
                    <span class="section-title">Open Tasks</span>
                </div>
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-text">No open tasks</div>
                </div>
            </div>
            
            <div class="tasks-section" style="border-top: 1px solid rgba(255,255,255,0.1);">
                <div class="section-header">
                    <span class="section-title">Recently Completed</span>
                    <span class="section-count">0</span>
                </div>
                <div class="empty-state">
                    <div class="empty-icon">🎯</div>
                    <div class="empty-text">No completed tasks yet</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const agents = {
            article: { id: 'article', name: 'Article Agent', emoji: '📝', type: 'article', status: 'online' },
            funnel: { id: 'funnel', name: 'Funnel Agent', emoji: '🏗️', type: 'funnel', status: 'online' },
            video: { id: 'video', name: 'Video Agent', emoji: '🎬', type: 'video', status: 'working' },
            research: { id: 'research', name: 'Research Agent', emoji: '🔍', type: 'research', status: 'idle' },
            code: { id: 'code', name: 'Code Agent', emoji: '💻', type: 'code', status: 'idle' },
            design: { id: 'design', name: 'Design Agent', emoji: '🎨', type: 'design', status: 'idle' },
            social: { id: 'social', name: 'Social Agent', emoji: '📱', type: 'social', status: 'idle' },
            email: { id: 'email', name: 'Email Agent', emoji: '📧', type: 'email', status: 'idle' },
            analytics: { id: 'analytics', name: 'Analytics Agent', emoji: '📊', type: 'analytics', status: 'idle' }
        };
        
        let selectedAgent = 'video';
        
        function renderAgentList() {
            const list = document.getElementById('agent-list');
            list.innerHTML = '';
            
            Object.values(agents).forEach(agent => {
                const item = document.createElement('div');
                item.className = `agent-item ${selectedAgent === agent.id ? 'active' : ''} ${agent.status}`;
                item.onclick = () => selectAgent(agent.id);
                
                const onlineIndicator = agent.status !== 'idle' ? '<div class="online-indicator"></div>' : '';
                
                item.innerHTML = `
                    ${onlineIndicator}
                    <div class="agent-avatar ${agent.type}">${agent.emoji}</div>
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-status-text ${agent.status}">
                            ${agent.status === 'working' ? '◉ Working' : 
                              agent.status === 'online' ? '● Online' : 
                              '○ Idle'}
                        </div>
                    </div>
                `;
                
                list.appendChild(item);
            });
        }
        
        function selectAgent(agentId) {
            selectedAgent = agentId;
            renderAgentList();
        }
        
        document.addEventListener('DOMContentLoaded', renderAgentList);
    </script>
</body>
</html>
