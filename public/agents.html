<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Command Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f1729 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 80px);
        }
        
        /* Left Panel - Agent Fleet */
        .fleet-panel {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
        }
        
        .fleet-header {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .fleet-count {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        
        .agent-list { display: flex; flex-direction: column; gap: 10px; }
        
        .agent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .agent-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        .agent-item.active { background: rgba(255,215,0,0.1); border: 2px solid #ffd700; }
        .agent-item.working { background: rgba(255,215,0,0.1); border-color: #ffd700; }
        
        .online-indicator {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: #00ff88;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .agent-avatar.article { background: rgba(0,212,255,0.15); }
        .agent-avatar.funnel { background: rgba(255,107,107,0.15); }
        .agent-avatar.video { background: rgba(168,85,247,0.15); }
        .agent-avatar.research { background: rgba(255,193,7,0.15); }
        .agent-avatar.code { background: rgba(0,230,118,0.15); }
        .agent-avatar.design { background: rgba(233,30,99,0.15); }
        .agent-avatar.social { background: rgba(33,150,243,0.15); }
        .agent-avatar.email { background: rgba(255,87,34,0.15); }
        .agent-avatar.analytics { background: rgba(156,39,176,0.15); }
        
        .agent-info { flex: 1; }
        .agent-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 2px; }
        .agent-status-text { font-size: 0.7rem; color: #666; }
        .agent-status-text.online { color: #00ff88; }
        .agent-status-text.working { color: #ffd700; }
        
        /* Center Panel - Agent Grid */
        .center-panel {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        
        .agent-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .agent-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
        }
        
        .agent-card.working {
            background: rgba(255,215,0,0.1);
            border: 2px solid #ffd700;
        }
        
        .agent-card.online {
            border: 1px solid rgba(0,255,136,0.3);
        }
        
        .card-avatar {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 15px;
        }
        
        .agent-card.article .card-avatar { background: rgba(0,212,255,0.15); }
        .agent-card.funnel .card-avatar { background: rgba(255,107,107,0.15); }
        .agent-card.video .card-avatar { background: rgba(168,85,247,0.15); }
        .agent-card.research .card-avatar { background: rgba(255,193,7,0.15); }
        .agent-card.code .card-avatar { background: rgba(0,230,118,0.15); }
        .agent-card.design .card-avatar { background: rgba(233,30,99,0.15); }
        .agent-card.social .card-avatar { background: rgba(33,150,243,0.15); }
        .agent-card.email .card-avatar { background: rgba(255,87,34,0.15); }
        .agent-card.analytics .card-avatar { background: rgba(156,39,176,0.15); }
        
        .card-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .card-status {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .card-status.online {
            background: rgba(0,255,136,0.15);
            color: #00ff88;
        }
        
        .card-status.working {
            background: rgba(255,215,0,0.15);
            color: #ffd700;
        }
        
        .card-status.idle {
            background: rgba(255,255,255,0.05);
            color: #666;
        }
        
        /* Right Panel */
        .right-panel {
            width: 380px;
            background: rgba(0,0,0,0.3);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .menu-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .menu-header h2 { 
            font-size: 1.1rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        .tasks-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .section-count {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            background: rgba(0,255,136,0.2);
            color: #00ff88;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="header">
        <h1>🎬 AI Agent Command Center</h1>
    </div>
    
    <div class="main-container">
        <!-- Left Panel - Agent Fleet -->
        <div class="fleet-panel">
            <div class="fleet-header">
                <span>Agent Fleet</span>
                <span class="fleet-count">9 Total</span>
            </div>
            <div class="agent-list" id="agent-list"></div>
        </div>
        
        <!-- Center Panel - Agent Grid -->
        <div class="center-panel">
            <div class="agents-grid" id="agents-grid"></div>
        </div>
        
        <!-- Right Panel - Main Menu -->
        <div class="right-panel">
            <div class="menu-header">
                <h2>📋 Main Menu</h2>
            </div>
            
            <div class="tasks-section">
                <div class="section-header">
                    <span class="section-title">Open Tasks</span>
                </div>
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-text">No open tasks</div>
                </div>
            </div>
            
            <div class="tasks-section" style="border-top: 1px solid rgba(255,255,255,0.1);">
                <div class="section-header">
                    <span class="section-title">Recently Completed</span>
                    <span class="section-count">0</span>
                </div>
                <div class="empty-state">
                    <div class="empty-icon">🎯</div>
                    <div class="empty-text">No completed tasks yet</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const agents = {
            article: { id: 'article', name: 'Article Agent', emoji: '📝', type: 'article', status: 'online' },
            funnel: { id: 'funnel', name: 'Funnel Agent', emoji: '🏗️', type: 'funnel', status: 'online' },
            video: { id: 'video', name: 'Video Agent', emoji: '🎬', type: 'video', status: 'working' },
            research: { id: 'research', name: 'Research Agent', emoji: '🔍', type: 'research', status: 'idle' },
            code: { id: 'code', name: 'Code Agent', emoji: '💻', type: 'code', status: 'idle' },
            design: { id: 'design', name: 'Design Agent', emoji: '🎨', type: 'design', status: 'idle' },
            social: { id: 'social', name: 'Social Agent', emoji: '📱', type: 'social', status: 'idle' },
            email: { id: 'email', name: 'Email Agent', emoji: '📧', type: 'email', status: 'idle' },
            analytics: { id: 'analytics', name: 'Analytics Agent', emoji: '📊', type: 'analytics', status: 'idle' }
        };
        
        let selectedAgent = 'video';
        
        function renderAgentList() {
            const list = document.getElementById('agent-list');
            list.innerHTML = '';
            
            Object.values(agents).forEach(agent => {
                const item = document.createElement('div');
                item.className = `agent-item ${selectedAgent === agent.id ? 'active' : ''} ${agent.status}`;
                item.onclick = () => selectAgent(agent.id);
                
                const onlineIndicator = agent.status !== 'idle' ? '<div class="online-indicator"></div>' : '';
                
                item.innerHTML = `
                    ${onlineIndicator}
                    <div class="agent-avatar ${agent.type}">${agent.emoji}</div>
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-status-text ${agent.status}">
                            ${agent.status === 'working' ? '◉ Working' : 
                              agent.status === 'online' ? '● Online' : 
                              '○ Idle'}
                        </div>
                    </div>
                `;
                
                list.appendChild(item);
            });
        }
        
        function renderAgentGrid() {
            const grid = document.getElementById('agents-grid');
            grid.innerHTML = '';
            
            Object.values(agents).forEach(agent => {
                const card = document.createElement('div');
                card.className = `agent-card ${agent.type} ${agent.status} ${selectedAgent === agent.id ? 'active' : ''}`;
                card.onclick = () => selectAgent(agent.id);
                
                const statusText = agent.status === 'working' ? 'Working' : 
                                  agent.status === 'online' ? 'Online' : 'Idle';
                
                card.innerHTML = `
                    <div class="card-avatar">${agent.emoji}</div>
                    <div class="card-name">${agent.name}</div>
                    <div class="card-status ${agent.status}">${statusText}</div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        function selectAgent(agentId) {
            selectedAgent = agentId;
            renderAgentList();
            renderAgentGrid();
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            renderAgentList();
            renderAgentGrid();
        });
    </script>
</body>
</html>
