<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Command Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f1729 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 80px);
        }
        
        /* Left Panel - Agent Fleet */
        .fleet-panel {
            width: 280px;
            background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            overflow-y: auto;
        }
        
        .fleet-header {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .fleet-count {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        
        .agent-list { display: flex; flex-direction: column; gap: 10px; }
        
        .agent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .agent-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        .agent-item.active { background: rgba(0,212,255,0.1); border-color: #00d4ff; }
        .agent-item.working { background: rgba(255,215,0,0.1); border-color: #ffd700; }
        
        .online-indicator {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: #00ff88;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .agent-avatar.article { background: rgba(0,212,255,0.15); }
        .agent-avatar.funnel { background: rgba(255,107,107,0.15); }
        .agent-avatar.video { background: rgba(168,85,247,0.15); }
        .agent-avatar.research { background: rgba(255,193,7,0.15); }
        .agent-avatar.code { background: rgba(0,230,118,0.15); }
        .agent-avatar.design { background: rgba(233,30,99,0.15); }
        .agent-avatar.social { background: rgba(33,150,243,0.15); }
        .agent-avatar.email { background: rgba(255,87,34,0.15); }
        .agent-avatar.analytics { background: rgba(156,39,176,0.15); }
        
        .agent-info { flex: 1; }
        .agent-name { font-size: 0.95rem; font-weight: 500; margin-bottom: 2px; }
        .agent-status-text { font-size: 0.75rem; color: #666; }
        .agent-status-text.online { color: #00ff88; }
        .agent-status-text.working { color: #ffd700; }
        
        /* Center Panel - Command Center */
        .command-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
        }
        
        .lead-agent-hub {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }
        
        .lead-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(168,85,247,0.3));
            border: 2px solid rgba(0,212,255,0.5);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .lead-info h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .lead-info p { color: #888; font-size: 0.95rem; }
        
        .lead-stats {
            display: flex;
            gap: 30px;
            margin-left: auto;
        }
        
        .lead-stat { text-align: center; }
        .lead-stat-value { font-size: 2rem; font-weight: 700; color: #00d4ff; }
        .lead-stat-label { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        
        /* Working Agents Area - NO ORBIT */
        .working-area {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            position: relative;
        }
        
        .working-header {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .working-count {
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .working-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        
        .working-agent {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .working-agent-avatar {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 12px;
        }
        
        .working-agent-avatar.article { background: rgba(0,212,255,0.2); }
        .working-agent-avatar.funnel { background: rgba(255,107,107,0.2); }
        .working-agent-avatar.video { background: rgba(168,85,247,0.2); }
        
        .working-agent-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; }
        .working-agent-task { font-size: 0.75rem; color: #888; line-height: 1.4; }
        
        .working-progress {
            margin-top: 12px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .working-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff9800);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        /* Right Panel - Main Menu */
        .menu-panel {
            width: 350px;
            background: rgba(0,0,0,0.3);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .menu-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .menu-header h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        
        .open-tasks-section {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            max-height: 40%;
            overflow-y: auto;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .section-count {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
        }
        
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        
        .task-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .task-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        
        .task-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .task-avatar.article { background: rgba(0,212,255,0.15); }
        .task-avatar.funnel { background: rgba(255,107,107,0.15); }
        .task-avatar.video { background: rgba(168,85,247,0.15); }
        
        .task-content { flex: 1; }
        .task-name { font-size: 0.85rem; margin-bottom: 3px; }
        .task-meta { font-size: 0.7rem; color: #666; }
        .task-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffd700;
        }
        
        .completed-tasks-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .completed-tasks-section .section-count {
            background: rgba(0,255,136,0.2);
            color: #00ff88;
        }
        
        .task-item.completed {
            border-left: 3px solid #00ff88;
            opacity: 0.8;
        }
        
        .task-item.completed .task-status { background: #00ff88; }
        .completion-time { font-size: 0.7rem; color: #00ff88; margin-top: 3px; }
        
        .empty-tasks {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.85rem;
        }
        
        .empty-tasks-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="header">
        <h1>🎬 AI Agent Command Center</h1>
    </div>
    
    <div class="main-container">
        <!-- Left Panel - Agent Fleet -->
        <div class="fleet-panel">
            <div class="fleet-header">
                <span>Agent Fleet</span>
                <span class="fleet-count" id="fleet-count">9 Total</span>
            </div>
            <div class="agent-list" id="agent-list"></div>
        </div>
        
        <!-- Center Panel - Command Center -->
        <div class="command-panel">
            <!-- Lead Agent Hub -->
            <div class="lead-agent-hub">
                <div class="lead-avatar">🎬</div>
                <div class="lead-info">
                    <h2>Pacino (Lead Agent)</h2>
                    <p>Coordinating agent fleet and task delegation</p>
                </div>
                <div class="lead-stats">
                    <div class="lead-stat">
                        <div class="lead-stat-value" id="stat-active">1</div>
                        <div class="lead-stat-label">Active</div>
                    </div>
                    <div class="lead-stat">
                        <div class="lead-stat-value" id="stat-completed">0</div>
                        <div class="lead-stat-label">Completed</div>
                    </div>
                    <div class="lead-stat">
                        <div class="lead-stat-value" id="stat-online">3</div>
                        <div class="lead-stat-label">Online</div>
                    </div>
                </div>
            </div>
            
            <!-- Working Agents Area -->
            <div class="working-area">
                <div class="working-header">
                    <span>Currently Working</span>
                    <span class="working-count">1 ACTIVE</span>
                </div>
                <div class="working-grid" id="working-grid">
                    <div class="working-agent">
                        <div class="working-agent-avatar video">🎬</div>
                        <div class="working-agent-name">Video Agent</div>
                        <div class="working-agent-task">Create clips</div>
                        <div class="working-progress">
                            <div class="working-progress-bar" style="width: 60%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Panel - Main Menu -->
        <div class="menu-panel">
            <div class="menu-header">
                <h2>📋 Main Menu</h2>
            </div>
            
            <div class="open-tasks-section">
                <div class="section-header">
                    <span class="section-title">Open Tasks</span>
                    <span class="section-count">0</span>
                </div>
                <div class="empty-tasks">
                    <div class="empty-tasks-icon">📭</div>
                    <div>No open tasks</div>
                </div>
            </div>
            
            <div class="completed-tasks-section">
                <div class="section-header">
                    <span class="section-title">Recently Completed</span>
                    <span class="section-count">0</span>
                </div>
                <div class="empty-tasks">
                    <div class="empty-tasks-icon">🎯</div>
                    <div>No completed tasks yet</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const agents = [
            { id: 'article', name: 'Article Agent', emoji: '📝', type: 'article', status: 'online' },
            { id: 'funnel', name: 'Funnel Agent', emoji: '🏗️', type: 'funnel', status: 'online' },
            { id: 'video', name: 'Video Agent', emoji: '🎬', type: 'video', status: 'working' },
            { id: 'research', name: 'Research Agent', emoji: '🔍', type: 'research', status: 'idle' },
            { id: 'code', name: 'Code Agent', emoji: '💻', type: 'code', status: 'idle' },
            { id: 'design', name: 'Design Agent', emoji: '🎨', type: 'design', status: 'idle' },
            { id: 'social', name: 'Social Agent', emoji: '📱', type: 'social', status: 'idle' },
            { id: 'email', name: 'Email Agent', emoji: '📧', type: 'email', status: 'idle' },
            { id: 'analytics', name: 'Analytics Agent', emoji: '📊', type: 'analytics', status: 'idle' }
        ];
        
        function renderAgentList() {
            const list = document.getElementById('agent-list');
            list.innerHTML = '';
            
            agents.forEach(agent => {
                const item = document.createElement('div');
                item.className = `agent-item ${agent.status}`;
                
                const onlineIndicator = agent.status !== 'idle' ? '<div class="online-indicator"></div>' : '';
                const statusText = agent.status === 'working' ? 'Working' : agent.status === 'online' ? 'Online' : 'Idle';
                const statusClass = agent.status;
                
                item.innerHTML = `
                    ${onlineIndicator}
                    <div class="agent-avatar ${agent.type}">${agent.emoji}</div>
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-status-text ${statusClass}">${statusText}</div>
                    </div>
                `;
                
                list.appendChild(item);
            });
        }
        
        document.addEventListener('DOMContentLoaded', renderAgentList);
    </script>
</body>
</html>
