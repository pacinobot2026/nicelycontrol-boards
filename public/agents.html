<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Command Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f1729 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 80px);
        }
        
        /* Left Panel */
        .fleet-panel {
            width: 260px;
            background: rgba(0,0,0,0.2);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            overflow-y: auto;
        }
        
        .fleet-header {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .fleet-count {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }
        
        .agent-list { display: flex; flex-direction: column; gap: 8px; }
        
        .agent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            border-left: 3px solid transparent;
        }
        
        .agent-item:hover { background: rgba(255,255,255,0.05); }
        .agent-item.online { border-left-color: #00ff88; }
        
        .agent-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .agent-avatar.article { background: rgba(0,212,255,0.2); }
        .agent-avatar.funnel { background: rgba(255,107,107,0.2); }
        .agent-avatar.video { background: rgba(168,85,247,0.2); }
        .agent-avatar.research { background: rgba(255,193,7,0.2); }
        .agent-avatar.code { background: rgba(0,230,118,0.2); }
        .agent-avatar.design { background: rgba(233,30,99,0.2); }
        .agent-avatar.social { background: rgba(33,150,243,0.2); }
        .agent-avatar.email { background: rgba(255,87,34,0.2); }
        .agent-avatar.analytics { background: rgba(156,39,176,0.2); }
        
        .agent-info { flex: 1; }
        .agent-name { font-size: 0.85rem; font-weight: 500; margin-bottom: 2px; }
        .agent-status-text { font-size: 0.7rem; }
        .agent-status-text.online { color: #00ff88; }
        .agent-status-text.idle { color: #666; }
        
        /* Center Panel */
        .center-panel {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .lead-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .lead-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(168,85,247,0.3));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }
        
        .lead-info { flex: 1; }
        .lead-info h2 { font-size: 1.3rem; margin-bottom: 5px; }
        .lead-info p { color: #888; font-size: 0.85rem; }
        
        .lead-stats {
            display: flex;
            gap: 30px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .stat-value.zero { color: #888; }
        .stat-value.online { color: #a855f7; }
        
        .stat-label {
            font-size: 0.65rem;
            color: #666;
            text-transform: uppercase;
            margin-top: 3px;
        }
        
        .working-section {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            min-height: 200px;
        }
        
        .working-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .working-title {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .active-badge {
            background: rgba(255,215,0,0.15);
            color: #ffd700;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .empty-working {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        /* Right Panel */
        .right-panel {
            width: 300px;
            background: rgba(0,0,0,0.2);
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }
        
        .menu-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .menu-header h2 { font-size: 1rem; font-weight: 600; }
        
        .menu-section {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .menu-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .menu-section-title {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .menu-count {
            background: rgba(255,255,255,0.1);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }
        
        .empty-menu {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Agent Command Center</h1>
    </div>
    
    <div class="main-container">
        <!-- Left Panel -->
        <div class="fleet-panel">
            <div class="fleet-header">
                <span>Agent Fleet</span>
                <span class="fleet-count">9 TOTAL</span>
            </div>
            <div class="agent-list" id="agent-list"></div>
        </div>
        
        <!-- Center Panel -->
        <div class="center-panel">
            <div class="lead-card">
                <div class="lead-avatar">🎬</div>
                <div class="lead-info">
                    <h2>Pacino (Lead Agent)</h2>
                    <p>Coordinating agent fleet and task delegation</p>
                </div>
                <div class="lead-stats">
                    <div class="stat-item">
                        <div class="stat-value zero" id="active-count">0</div>
                        <div class="stat-label">Active</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value zero">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value online" id="online-count">3</div>
                        <div class="stat-label">Online</div>
                    </div>
                </div>
            </div>
            
            <div class="working-section">
                <div class="working-header">
                    <span class="working-title">Currently Working</span>
                    <span class="active-badge">0 ACTIVE</span>
                </div>
                <div class="empty-working">
                    No agents currently working
                </div>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="menu-header">
                <h2>Main Menu</h2>
            </div>
            
            <div class="menu-section">
                <div class="menu-section-header">
                    <span class="menu-section-title">Open Tasks</span>
                    <span class="menu-count">0</span>
                </div>
                <div class="empty-menu">No open tasks</div>
            </div>
            
            <div class="menu-section">
                <div class="menu-section-header">
                    <span class="menu-section-title">Recently Completed</span>
                    <span class="menu-count">0</span>
                </div>
                <div class="empty-menu">No completed tasks yet</div>
            </div>
        </div>
    </div>
    
    <script>
        const agents = [
            { id: 'article', name: 'Article Agent', emoji: '📝', type: 'article', status: 'online' },
            { id: 'funnel', name: 'Funnel Agent', emoji: '🏗️', type: 'funnel', status: 'online' },
            { id: 'video', name: 'Video Agent', emoji: '🎬', type: 'video', status: 'online' },
            { id: 'research', name: 'Research Agent', emoji: '🔍', type: 'research', status: 'idle' },
            { id: 'code', name: 'Code Agent', emoji: '💻', type: 'code', status: 'idle' },
            { id: 'design', name: 'Design Agent', emoji: '🎨', type: 'design', status: 'idle' },
            { id: 'social', name: 'Social Agent', emoji: '📱', type: 'social', status: 'idle' },
            { id: 'email', name: 'Email Agent', emoji: '📧', type: 'email', status: 'idle' },
            { id: 'analytics', name: 'Analytics Agent', emoji: '📊', type: 'analytics', status: 'idle' }
        ];
        
        function renderAgentList() {
            const list = document.getElementById('agent-list');
            list.innerHTML = '';
            
            agents.forEach(agent => {
                const item = document.createElement('div');
                item.className = `agent-item ${agent.status}`;
                
                const statusText = agent.status === 'online' ? 'Online' : 'Idle';
                const statusClass = agent.status === 'online' ? 'online' : 'idle';
                
                item.innerHTML = `
                    <div class="agent-avatar ${agent.type}">${agent.emoji}</div>
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-status-text ${statusClass}">${statusText}</div>
                    </div>
                `;
                
                list.appendChild(item);
            });
        }
        
        document.addEventListener('DOMContentLoaded', renderAgentList);
    </script>
</body>
</html>
