name: deploy-vizard-dashboard
version: 1.0.0
description: >
  Full deployment guide for the Vizard Clips Dashboard platform.
  Guides the customer through forking the GitHub repo, creating a Supabase
  database, running migrations, deploying to Vercel, and wiring all
  environment variables so the app is live and fully operational.
category: deployment
author: OpenClaw
tags: [vercel, supabase, nextjs, dashboard]

# ─────────────────────────────────────────────
# SOURCE REPOSITORY
# ─────────────────────────────────────────────
source:
  github: https://github.com/pacinobot2026/control-board
  branch: main
  framework: nextjs
  node_version: "18"

# ─────────────────────────────────────────────
# WHAT THE CUSTOMER NEEDS BEFORE STARTING
# ─────────────────────────────────────────────
prerequisites:
  - A GitHub account (free tier is fine) — sign up at https://github.com
  - A Vercel account — sign up at https://vercel.com (free Hobby plan works)
  - API keys for any optional integrations (listed in the env_vars section below)

# ─────────────────────────────────────────────
# DEPLOYMENT STEPS
# ─────────────────────────────────────────────
steps:

  # ── STEP 1: Fork the source repo ──────────────────────────
  - id: fork_repo
    title: "Fork the control-board repo to your GitHub account"
    description: >
      You need your own copy of the repo in GitHub so Vercel can deploy it.
      This step is required and cannot be skipped.
    instructions:
      - Go to https://github.com/pacinobot2026/control-board
      - In the top-right corner click "Fork"
      - Leave the default settings and click "Create fork"
      - You now have a copy at https://github.com/YOUR_USERNAME/control-board
    note: "Keep this tab open — you will need it in the next step."

  # ── STEP 2: Import the repo into Vercel and deploy ────────
  - id: import_vercel_project
    title: "Import control-board into Vercel and trigger the first deploy"
    description: >
      Create the Vercel project by connecting your GitHub and importing the repo.
      The first deploy will FAIL — this is expected because the database is not
      connected yet. Do not worry; you will fix it after setting up Supabase.
    instructions:
      - Go to https://vercel.com/dashboard
      - In the left sidebar click "Projects"
      - Click "Add New" → "Project"
      - If GitHub is not connected yet, click "Connect GitHub" and authorise Vercel
      - Find your forked "control-board" repo in the list and click "Import"
      - Leave all settings as default and click "Deploy"
      - ⚠️ The deployment WILL FAIL — this is completely normal. Move on to Step 3.

  # ── STEP 3: Install Supabase and connect to control-board ─
  - id: install_supabase_marketplace
    title: "Install Supabase via the Vercel Marketplace and connect it"
    description: >
      Install Supabase directly through Vercel so the database is linked
      automatically — no manual env var copying needed.
    instructions:
      - Go to https://vercel.com/marketplace/supabase
      - Click "Install"
      - When asked, select "Create new Supabase account"
      - Select your Vercel team
      - Under "Configure plan" choose the "Supabase Free Plan"
      - Click "Create" and wait for the progress bar to finish
      - When the "Connect a project" screen appears, select your "control-board" project
      - Click "Connect"
      - Supabase is now linked — all database env vars are injected automatically
    note: >
      If you already have a Supabase account, select "Connect existing Supabase account"
      instead of "Create new" at the first prompt.

  # ── STEP 4: Redeploy ──────────────────────────────────────
  - id: redeploy
    title: "Redeploy control-board now that everything is set up"
    description: >
      The first deployment failed because Supabase wasn't connected.
      Now that everything is wired up, trigger a redeploy.
    instructions:
      - Go to https://vercel.com/dashboard
      - Click the "control-board" project
      - In the left sidebar click "Deployments"
      - You will see the failed deployment at the top of the list
      - On the right side of that row click the "⋯" (three-dot) menu
      - Click "Redeploy"
      - Wait for the deployment to complete (usually 1–2 minutes)

  # ── STEP 5: Set up the database and log in ───────────────
  - id: confirm
    title: "Set up the database and log in"
    description: >
      Once the redeployment succeeds, the login page includes a one-time
      "Set Up Database" button that creates all required tables automatically.
      It disappears after it completes and will never show again.
    instructions:
      - On the control-board project page in Vercel, look for the "Domains" section
      - You will see a URL like:
          control-board-XXXXXXXXXXXXXX.vercel.app
      - Use the first / shorter URL — not one that contains "-projects"
      - Open the URL in your browser
      - At the top of the login page you will see a yellow "Set Up Database" button
      - Click it and wait for it to show "✅ Database ready!"
      - The button will disappear automatically — this only happens once
      - Register your account and log in
    next_steps:
      - Add a custom domain in Vercel → Project Settings → Domains
      - To enable Vimeo auto-import, run the monitor script in a separate terminal:
          npm run monitor

# ─────────────────────────────────────────────
# FULL ENV VAR REFERENCE (for manual setup)
# ─────────────────────────────────────────────
env_vars_reference:
  required:
    SUPABASE_URL:
      description: "Your Supabase project URL"
      example: "https://YOUR_PROJECT_REF.supabase.co"
    SUPABASE_SERVICE_ROLE_KEY:
      description: "Supabase service role key — keep secret, server-side only"
      example: "eyJhbGci..."
    NEXT_PUBLIC_SUPABASE_URL:
      description: "Same as SUPABASE_URL — exposed to browser"
      example: "https://YOUR_PROJECT_REF.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY:
      description: "Supabase anon (public) key"
      example: "eyJhbGci..."
    DASHBOARD_PASSWORD:
      description: "Password customers use to log in to the dashboard"
      example: "YourStrongPassword123!"
    SESSION_SECRET:
      description: "Secret used to sign session cookies — any random string ≥ 32 chars"
      example: "change_this_to_a_long_random_string"
    POSTGRES_URL:
      description: "Pooled Postgres connection string from Supabase"
      example: "postgres://postgres.REF:PASSWORD@aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require"
    POSTGRES_URL_NON_POOLING:
      description: "Direct Postgres connection string (used for migrations)"
      example: "postgres://postgres.REF:PASSWORD@db.REF.supabase.co:5432/postgres?sslmode=require"
    POSTGRES_PASSWORD:
      description: "Your Supabase database password"
    POSTGRES_USER:
      description: "Supabase Postgres user"
      default: "postgres"
    POSTGRES_HOST:
      description: "Supabase Postgres host"
      example: "db.YOUR_PROJECT_REF.supabase.co"
    POSTGRES_DATABASE:
      description: "Database name"
      default: "postgres"


# ─────────────────────────────────────────────
# DATABASE MIGRATIONS (run in this order)
# ─────────────────────────────────────────────
migrations:
  - order: 1
    file: migrations/001_create_clips_table.sql
    description: "clips table — stores video clips from Vizard/Vimeo or manual URLs"
  - order: 2
    file: migrations/002_create_content_tables.sql
    description: "ideas, bookmarks, projects, shopping_items tables with RLS"
  - order: 3
    file: migrations/003_create_settings_table.sql
    description: "per-user settings key/value store"

# ─────────────────────────────────────────────
# TROUBLESHOOTING
# ─────────────────────────────────────────────
troubleshooting:
  - issue: "Build fails with 'SUPABASE_URL is not defined'"
    fix: "Check that all env vars were saved in Vercel. Go to Project → Settings → Environment Variables."

  - issue: "Login page shows 'Invalid password'"
    fix: "The DASHBOARD_PASSWORD env var must match exactly what you type. Check for trailing spaces."

  - issue: "Ideas / Bookmarks show 'Unauthorized'"
    fix: >
      These pages use Supabase Auth (email/password). The user must sign up at
      /api/auth/signup or via the Supabase dashboard under Authentication → Users.

  - issue: "Database tables don't exist"
    fix: >
      Open the Supabase SQL Editor for your project and run each migration file
      in order: 001, 002, 003. Files are in the migrations/ folder of the repo.

  - issue: "Vercel deployment shows 500 errors"
    fix: >
      Check Vercel → Deployments → click the deployment → Functions tab for logs.
      Most errors are missing env vars or a Supabase connection issue.
